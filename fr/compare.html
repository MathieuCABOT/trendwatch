<title>Trendwatch</title>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0d0d0d;color:#fff;font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.lock{background:#1a1a19;border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:28px 30px;width:min(420px,92vw);box-shadow:0 10px 30px rgba(0,0,0,.35)}

.lock input[type=password]{width:100%;box-sizing:border-box;padding:11px 12px;border-radius:10px;border:1px solid rgba(255,255,255,.18);background:#0d0d0d;color:#fff;font:inherit}
.lock button{margin-top:12px;width:100%;padding:11px;border:0;border-radius:10px;background:#3987e5;color:#fff;font:inherit;font-weight:600;cursor:pointer}
.lock label{display:flex;gap:8px;align-items:center;margin-top:12px;font-size:13px;color:#c3c2b7}
.lock .err{color:#e66767;font-size:13px;min-height:18px;margin-top:8px}
.mark{width:34px;height:34px;border-radius:9px;background:#3987e5;display:inline-grid;place-items:center;margin-bottom:12px}
