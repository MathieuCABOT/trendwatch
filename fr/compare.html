.lock{background:#1a1a19;border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:28px 30px;width:min(420px,92vw);box-shadow:0 10px 30px rgba(0,0,0,.35)}

.lock label{display:flex;gap:8px;align-items:center;margin-top:12px;font-size:13px;color:#c3c2b7}
.lock .err{color:#e66767;font-size:13px;min-height:18px;margin-top:8px}
